version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Keep Node type definitions on the runtime's major (engines: node 24.x).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-non-major:
        update-types: [minor, patch]
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      cargo-non-major:
        update-types: [minor, patch]
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-non-major:
        update-types: [minor, patch]
        patterns: ["*"]
