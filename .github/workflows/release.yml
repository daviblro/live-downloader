name: Publish Windows release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish NSIS installer
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID || secrets.TWITCH_CLIENT_ID }}
      LIVE_DOWNLOADER_UPDATER_PUBKEY: ${{ vars.LIVE_DOWNLOADER_UPDATER_PUBKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Confirm tag matches the application version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag '$env:GITHUB_REF_NAME' does not match application version '$version'."
          }

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate project versions
        run: pnpm version:check

      - name: Fetch verified sidecars
        run: pnpm sidecars:fetch

      - name: Validate frontend
        run: pnpm format:check && pnpm lint && pnpm typecheck && pnpm test && pnpm build

      - name: Validate Rust
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock

      - name: Build frontend and NSIS installer
        shell: pwsh
        run: |
          $hasPublicKey = -not [string]::IsNullOrWhiteSpace($env:LIVE_DOWNLOADER_UPDATER_PUBKEY)
          $hasPrivateKey = -not [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)
          if ($hasPublicKey -ne $hasPrivateKey) {
            throw "Configure both the LIVE_DOWNLOADER_UPDATER_PUBKEY variable and the TAURI_SIGNING_PRIVATE_KEY secret, or neither."
          }
          if ($hasPrivateKey) {
            node scripts/write-updater-config.mjs src-tauri/target/updater.conf.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            pnpm exec tauri build --bundles nsis --config src-tauri/target/updater.conf.json
          } else {
            Write-Warning "Updater signing is not configured; publishing the installer without in-app update metadata."
            pnpm exec tauri build --bundles nsis
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect release assets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            New-Item -ItemType Directory -Force release-assets | Out-Null
            Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe release-assets/
          } else {
            node scripts/write-updater-manifest.mjs src-tauri/target/release/bundle/nsis release-assets
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publish installer to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          name: Live Downloader ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true
