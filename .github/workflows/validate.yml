name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows build and test
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID || secrets.TWITCH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate project versions
        run: pnpm version:check

      - name: Fetch verified sidecars
        run: pnpm sidecars:fetch

      - name: Check frontend formatting
        run: pnpm format:check

      - name: Lint frontend
        run: pnpm lint

      - name: Type-check frontend
        run: pnpm typecheck

      - name: Test frontend
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust core
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock

      - name: Build NSIS installer
        run: pnpm exec tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: live-downloader-windows-x64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
